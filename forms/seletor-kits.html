<title>Kits para Criadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Karla:wght@400;500;600;700&display=swap">

<!--
  ============================================================
  SELETOR DE KITS — bloco Custom HTML para o formulario de
  cadastro de afiliado no GoHighLevel.

  Grava dois campos customizados quando o criador clica num kit:
    Afiliado — Kit alocado     <- REFERENCIA do ERP, ex. 905.K01.999
    Afiliado — Marca alocada   <- marca, derivada do kit

  Grava a referencia, nao o nome. O nome do kit muda com o tempo; a
  referencia nao, e e por ela que o Sankhya identifica o produto.

  Procura os campos por PEDACO de chave (kit_alocado, marca_alocada),
  nao pela chave inteira. O GHL tem duas chaves para o mesmo campo:
  a fieldKey da API e a "Chave de consulta" do formulario, e a segunda
  carrega o travessao do nome do campo. Pedaco casa com as duas.

  INSTALACAO EM 3 PASSOS: ver docs/seletor-de-kits.md

  PARA TROCAR OS KITS: edite a lista KITS abaixo. Se o campo do GHL
  for lista suspensa, a `ref` tem que estar cadastrada na picklist;
  se for texto, nao precisa de nada. A tabela com os 20 kits e suas
  referencias esta em docs/seletor-de-kits.md.

  SE NAO GRAVAR: DEBUG = true e recarregue o formulario.
  ============================================================
-->

<div id="nk-seletor">
<style>
#nk-seletor{
  /* Cores dos proprios produtos: natural, preto, branco. A teca e o
     unico acento; o verde so aparece no que esta escolhido. */
  --papel:#F7F7F4; --superficie:#FFFFFF; --fibra:#EDEAE1;
  --tinta:#1C1B18; --tinta-2:#5F5B51; --tinta-3:#8A857A;
  --teca:#A0642B; --mata:#2F5D4A; --borda:#DEDAD0;
  --sombra:0 1px 2px rgba(28,27,24,.05), 0 10px 30px -16px rgba(28,27,24,.18);
  --r:14px;

  font-family:Karla,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--tinta); background:var(--papel);
  padding:clamp(20px,4vw,40px) clamp(16px,3vw,28px);
  border-radius:var(--r); container-type:inline-size;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){
  #nk-seletor:not([data-tema="claro"]){
    --papel:#141412; --superficie:#1E1E1B; --fibra:#2A2A26;
    --tinta:#F2F0EA; --tinta-2:#B4AFA3; --tinta-3:#8A857A;
    --teca:#D08F4A; --mata:#5C9C7D; --borda:#33322D;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
  }
}
#nk-seletor[data-tema="escuro"]{
  --papel:#141412; --superficie:#1E1E1B; --fibra:#2A2A26;
  --tinta:#F2F0EA; --tinta-2:#B4AFA3; --tinta-3:#8A857A;
  --teca:#D08F4A; --mata:#5C9C7D; --borda:#33322D;
  --sombra:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -16px rgba(0,0,0,.6);
}

#nk-seletor *{box-sizing:border-box;margin:0}

/* Quando o seletor E a pagina inteira (previa fora do GHL), ele preenche a
   viewport. Dentro do formulario ele esta aninhado fundo na arvore, entao
   `body >` nunca casa e nada disto vaza para la. */
body:has(> #nk-seletor){margin:0}
body > #nk-seletor{min-height:100vh;border-radius:0}

.nk-topo{max-width:58ch;display:flex;flex-direction:column;gap:9px;margin-bottom:clamp(22px,3vw,30px)}
.nk-olho{font:600 11px/1 Karla,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--teca)}
.nk-titulo{
  font-family:"Bricolage Grotesque",Karla,sans-serif;font-weight:700;
  font-size:clamp(23px,4.4cqw,32px);line-height:1.08;letter-spacing:-.022em;text-wrap:balance;
}
.nk-sub{font-size:15.5px;line-height:1.55;color:var(--tinta-2)}

.nk-grade{display:grid;gap:16px;grid-template-columns:1fr;margin-bottom:18px}
@container (min-width:560px){.nk-grade{grid-template-columns:repeat(2,1fr)}}
@container (min-width:860px){.nk-grade{grid-template-columns:repeat(3,1fr)}}

.nk-card{position:relative;display:block;cursor:pointer}
.nk-card input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}

.nk-corpo{
  height:100%;display:flex;flex-direction:column;
  background:var(--superficie);border:1.5px solid var(--borda);
  border-radius:var(--r);overflow:hidden;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.nk-card:hover .nk-corpo{border-color:var(--tinta-3);box-shadow:var(--sombra)}
.nk-card input:focus-visible + .nk-corpo{outline:2px solid var(--teca);outline-offset:2px}
.nk-card input:checked + .nk-corpo{border-color:var(--mata);box-shadow:0 0 0 1.5px var(--mata),var(--sombra)}

.nk-foto{aspect-ratio:4/3;background:var(--fibra);position:relative;overflow:hidden;display:grid;place-items:center}
.nk-foto img{width:100%;height:100%;object-fit:cover;display:block}
/* Sem foto: bloco tramado, que parece intencional em vez de quebrado */
.nk-sem-foto{
  width:100%;height:100%;display:grid;place-items:center;
  background:
    repeating-linear-gradient(90deg,transparent 0 7px,rgba(160,100,43,.08) 7px 8px),
    repeating-linear-gradient(0deg,transparent 0 7px,rgba(160,100,43,.08) 7px 8px),
    var(--fibra);
}
.nk-sem-foto span{
  font-family:"Bricolage Grotesque",Karla,sans-serif;font-weight:700;
  font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--tinta-3);
  text-align:center;padding:0 18px;line-height:1.3;
}

.nk-marca{
  position:absolute;top:11px;left:11px;
  font:700 10.5px/1 Karla,sans-serif;letter-spacing:.07em;text-transform:uppercase;
  padding:5px 9px;border-radius:999px;
  background:var(--superficie);color:var(--tinta-2);border:1px solid var(--borda);
}
.nk-check{
  position:absolute;top:11px;right:11px;width:28px;height:28px;border-radius:50%;
  background:var(--mata);display:grid;place-items:center;
  opacity:0;transform:scale(.7);transition:opacity .16s ease,transform .16s ease;
}
.nk-card input:checked + .nk-corpo .nk-check{opacity:1;transform:scale(1)}
.nk-check svg{width:15px;height:15px;stroke:#fff;stroke-width:2.5;fill:none}

.nk-info{padding:15px 16px 17px;display:flex;flex-direction:column;gap:10px;flex:1}
.nk-cabeca{display:flex;flex-direction:column;gap:3px}
.nk-nome{
  font-family:"Bricolage Grotesque",Karla,sans-serif;font-weight:700;
  font-size:19px;line-height:1.14;letter-spacing:-.012em;
}
/* A referencia e o que de fato e gravado. Monoespacada e com digito tabular
   porque codigo se le caractere por caractere, nao como palavra. */
.nk-ref{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;letter-spacing:.02em;color:var(--tinta-3);
  font-variant-numeric:tabular-nums;
}
.nk-itens{list-style:none;display:flex;flex-direction:column;gap:5px;padding:0}
.nk-itens li{font-size:13.5px;line-height:1.4;color:var(--tinta-2);padding-left:14px;position:relative}
.nk-itens li::before{
  content:"";position:absolute;left:0;top:.55em;
  width:5px;height:5px;border-radius:50%;background:var(--teca);opacity:.55;
}

.nk-barra{
  position:sticky;bottom:0;z-index:5;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 17px;border-radius:var(--r);
  background:var(--superficie);border:1.5px solid var(--borda);box-shadow:var(--sombra);
}
.nk-barra[data-escolhido="true"]{border-color:var(--mata)}
.nk-barra-rotulo{font:600 11px/1 Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.nk-barra-valor{font-family:"Bricolage Grotesque",Karla,sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.nk-barra-valor code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;
  font-weight:400;color:var(--tinta-2);
}
.nk-barra[data-escolhido="false"] .nk-barra-valor{color:var(--tinta-3);font-weight:500}

.nk-aviso{
  margin-top:14px;padding:13px 15px;border-radius:10px;
  background:var(--fibra);border:1px solid var(--borda);
  font-size:13px;line-height:1.55;color:var(--tinta-2);
}
.nk-aviso code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:var(--superficie);padding:1px 5px;border-radius:4px;border:1px solid var(--borda);
}
.nk-aviso b{color:var(--tinta)}
.nk-oculto{display:none}

@media (prefers-reduced-motion:reduce){#nk-seletor *{transition:none!important}}
</style>

<style>
/* Esta regra e a UNICA nao escopada em #nk-seletor, porque o campo do GHL
   vive fora do nosso bloco. Nome de classe improvavel de colidir.

   Nao usa display:none de proposito. Campo obrigatorio com display:none
   trava o envio: o navegador tenta focar para reclamar, nao consegue, e
   engole o submit sem dizer nada. Isto some da tela mas continua focavel
   e continua sendo enviado. */
.nk-campo-oculto{
  position:absolute !important;
  width:1px !important; height:1px !important;
  padding:0 !important; margin:-1px !important;
  overflow:hidden !important; border:0 !important;
  clip-path:inset(50%) !important; white-space:nowrap !important;
}
</style>

<div class="nk-topo">
  <p class="nk-olho">Programa de afiliados</p>
  <h2 class="nk-titulo">Escolha o kit que combina com o seu conteúdo</h2>
  <p class="nk-sub">
    Você recebe um destes três para gravar. Escolha o que faz mais sentido para
    a sua audiência &mdash; quem conhece ela é você.
  </p>
</div>

<div class="nk-grade" id="nk-grade"></div>

<div class="nk-barra" id="nk-barra" data-escolhido="false">
  <span class="nk-barra-rotulo">Seu kit</span>
  <span class="nk-barra-valor" id="nk-barra-valor">Nenhum selecionado ainda</span>
</div>

<div class="nk-aviso nk-oculto" id="nk-aviso"></div>

<script>
(function(){
  "use strict";

  /* ============ CONFIGURACAO ============ */

  // true mostra um painel com tudo o que o script achou no DOM.
  // Use quando o campo nao estiver gravando.
  var DEBUG = false;

  // Esconde o campo original do GHL, para o criador nao ver um dropdown
  // duplicado. So sobe na arvore enquanto o ancestral contiver apenas
  // aquele campo, entao nao ha risco de esconder meio formulario.
  var ESCONDER_ORIGINAL = true;

  // Pedaco da chave dos campos customizados no GHL.
  //
  // De proposito SEM o prefixo `afiliado__`. O GHL tem duas chaves para o
  // mesmo campo e elas nao batem:
  //
  //   fieldKey da API      contact.afiliado__kit_alocado
  //   Chave de consulta    afiliado_—__kit_alocado      <- com travessao
  //
  // A do formulario deriva do nome do campo ("Afiliado — Kit alocado") e
  // carrega o travessao. Procurar por `afiliado__kit_alocado` nao casa com
  // ela. `kit_alocado` casa com as duas, e nenhum outro campo da sub-conta
  // contem esse pedaco — conferido na lista completa de campos.
  var CAMPOS = {
    kit:   "kit_alocado",
    marca: "marca_alocada"
  };

  /* ============ OS KITS ============
     `ref`    a referencia do ERP. E ISTO que vai gravado no campo.
              O nome do kit muda com o tempo; a referencia nao. E e por ela
              que o Sankhya identifica o produto, entao e ela que amarra a
              amostra a nota fiscal.
     `nome`   so para o criador ler. Trocar aqui nao afeta nada a jusante.
     `marca`  derivada do kit, nao do nicho: e a marca que emite a nota.
     `foto`   URL da imagem. Vazio mostra bloco tramado com o nome.        */
  var KITS = [
    {
      nome:  "Churrasco",
      ref:   "905.K01.999",
      marca: "Teak Brazil",
      itens: ["Tábua de corte em teca com gaveta", "Petisqueira de teca com 3 molheiras"],
      foto:  ""
    },
    {
      nome:  "Micro-ondas",
      ref:   "914.K01.002",
      marca: "Mundo UD",
      itens: ["Caçarola para micro-ondas com cesto", "Cook freezer com cesto",
              "Tampa para micro-ondas", "Omeleteira para micro-ondas"],
      foto:  ""
    },
    {
      nome:  "Frasqueira de Medicamentos",
      ref:   "907.K01.999",
      marca: "Mundo UD",
      itens: ["Frasqueira de medicamentos 1,4L", "Frasqueira de medicamentos mega luxo",
              "Organiza tudo com 7 divisórias"],
      foto:  ""
    }
  ];

  /* ============ DESENHO ============ */

  var raiz     = document.getElementById("nk-seletor");
  var grade    = document.getElementById("nk-grade");
  var barra    = document.getElementById("nk-barra");
  var barraVal = document.getElementById("nk-barra-valor");
  var aviso    = document.getElementById("nk-aviso");

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  grade.innerHTML = KITS.map(function(kit, i){
    var foto = kit.foto
      ? '<img src="' + esc(kit.foto) + '" alt="Kit ' + esc(kit.nome) + '" loading="lazy">'
      : '<div class="nk-sem-foto"><span>' + esc(kit.nome) + '</span></div>';

    return '<label class="nk-card">' +
      '<input type="radio" name="nk-kit" value="' + esc(kit.ref) + '" data-i="' + i + '">' +
      '<div class="nk-corpo">' +
        '<div class="nk-foto">' + foto +
          '<span class="nk-marca">' + esc(kit.marca) + '</span>' +
          '<span class="nk-check" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
          '</span>' +
        '</div>' +
        '<div class="nk-info">' +
          '<div class="nk-cabeca">' +
            '<h3 class="nk-nome">' + esc(kit.nome) + '</h3>' +
            '<p class="nk-ref">' + esc(kit.ref) + '</p>' +
          '</div>' +
          '<ul class="nk-itens">' +
            kit.itens.map(function(it){ return "<li>" + esc(it) + "</li>"; }).join("") +
          '</ul>' +
        '</div>' +
      '</div>' +
    '</label>';
  }).join("");

  /* ============ ESCRITA NOS CAMPOS DO GHL ============ */

  function acharCampos(chave){
    var sel = [];
    ["input","select","textarea"].forEach(function(t){
      ['[name*="','[id*="','[data-q*="'].forEach(function(p){ sel.push(t + p + chave + '"]'); });
    });
    var achados = [];
    document.querySelectorAll(sel.join(",")).forEach(function(el){
      if (raiz.contains(el)) return;                 // nunca os nossos radios
      if (achados.indexOf(el) === -1) achados.push(el);
    });
    return achados;
  }

  function disparar(el){
    el.dispatchEvent(new Event("input",  { bubbles:true }));
    el.dispatchEvent(new Event("change", { bubbles:true }));
  }

  // Campo controlado por framework ignora `el.value = x`: o valor aparece na
  // tela e nao vai no submit. O setter nativo do prototype e o unico jeito
  // de o React/Vue registrar a mudanca.
  function setNativo(el, valor){
    var proto = (el.tagName === "TEXTAREA")
      ? window.HTMLTextAreaElement.prototype
      : window.HTMLInputElement.prototype;
    var d = Object.getOwnPropertyDescriptor(proto, "value");
    if (d && d.set) { d.set.call(el, valor); } else { el.value = valor; }
    disparar(el);
  }

  function escrever(els, valor){
    var escreveu = false;
    els.forEach(function(el){
      if (el.tagName === "SELECT"){
        var opt = null;
        for (var i = 0; i < el.options.length; i++){
          var o = el.options[i];
          if (o.value === valor || o.textContent.trim() === valor){ opt = o; break; }
        }
        if (!opt) return;
        el.value = opt.value; disparar(el); escreveu = true;

      } else if (el.type === "radio"){
        var rot = el.labels && el.labels[0] ? el.labels[0].textContent.trim() : "";
        if (el.value === valor || rot === valor){ el.checked = true; disparar(el); escreveu = true; }

      } else if (el.type === "checkbox"){
        return;

      } else {
        setNativo(el, valor); escreveu = true;
      }
    });
    return escreveu;
  }

  // Sobe do campo ate o involucro que so contem ele, para nao sobrar um
  // retangulo vazio com o padding do GHL na tela. Para de subir assim que o
  // ancestral tiver outro campo dentro, entao nao existe o risco de esconder
  // meio formulario.
  function involucroDe(el){
    var no = el;
    for (var i = 0; i < 3; i++){
      var pai = no.parentElement;
      if (!pai || pai === document.body) break;
      if (pai.querySelectorAll("input,select,textarea").length > 1) break;
      no = pai;
    }
    return no;
  }

  // Roda no carregamento e a cada mudanca no DOM, NAO no clique. Antes isto
  // dependia de uma escrita bem-sucedida: o dropdown ficava visivel ate o
  // criador clicar num kit, e ficava para sempre se a escrita falhasse. Sao
  // dois problemas diferentes e nao devem estar amarrados.
  function esconderCampos(){
    if (!ESCONDER_ORIGINAL) return 0;
    var n = 0;
    [CAMPOS.kit, CAMPOS.marca].forEach(function(chave){
      acharCampos(chave).forEach(function(el){
        var inv = involucroDe(el);
        // O React do GHL redesenha e limpa a classe. Reaplicar e barato.
        if (!inv.classList.contains("nk-campo-oculto")){
          inv.classList.add("nk-campo-oculto");
        }
        n++;
      });
    });
    return n;
  }

  /* ============ APLICACAO ============ */

  var pendente = null;      // escolha feita antes de os campos existirem

  function aplicar(valor, marca){
    var cKit   = acharCampos(CAMPOS.kit);
    var cMarca = acharCampos(CAMPOS.marca);

    if (!cKit.length){ pendente = { valor:valor, marca:marca }; return false; }

    var ok = escrever(cKit, valor);
    if (cMarca.length) escrever(cMarca, marca);

    pendente = ok ? null : { valor:valor, marca:marca };
    if (DEBUG) relatar(cKit, cMarca, valor, ok);
    return ok;
  }

  function relatar(cKit, cMarca, valor, ok){
    aviso.classList.remove("nk-oculto");
    aviso.innerHTML =
      "<b>Diagnóstico</b> (DEBUG = true)<br>" +
      "Valor a gravar: <code>" + esc(valor) + "</code><br>" +
      "Campos de kit encontrados: <b>" + cKit.length + "</b>" +
      (cKit.length ? " &rarr; " + cKit.map(function(e){
        return "<code>" + esc(e.tagName.toLowerCase() + (e.type ? ":" + e.type : "") +
               " name=" + (e.getAttribute("name") || "—")) + "</code>";
      }).join(" ") : "") + "<br>" +
      "Campos de marca encontrados: <b>" + cMarca.length + "</b><br>" +
      "Gravou: <b>" + (ok ? "sim" : "NÃO") + "</b>";
  }

  function relatarCarga(){
    var cKit = acharCampos(CAMPOS.kit), cMarca = acharCampos(CAMPOS.marca);
    aviso.classList.remove("nk-oculto");
    aviso.innerHTML =
      "<b>Diagnóstico no carregamento</b> (DEBUG = true)<br>" +
      "Procurando por <code>*" + esc(CAMPOS.kit) + "*</code>: <b>" + cKit.length + "</b> encontrado(s)" +
      (cKit.length ? " &rarr; " + cKit.map(function(e){
        return "<code>" + esc(e.tagName.toLowerCase() + (e.type ? ":" + e.type : "") +
               " name=" + (e.getAttribute("name") || "—") +
               " id=" + (e.getAttribute("id") || "—")) + "</code>";
      }).join(" ") : " &mdash; <b>é por isto que nada grava</b>") + "<br>" +
      "Procurando por <code>*" + esc(CAMPOS.marca) + "*</code>: <b>" + cMarca.length + "</b> encontrado(s)<br>" +
      "Escondidos: <b>" + (cKit.length + cMarca.length) + "</b>" +
      (cKit.length && cKit[0].closest(".nk-campo-oculto") ? " (classe aplicada)" : "");
  }

  function modoDemo(valor, marca){
    aviso.classList.remove("nk-oculto");
    aviso.innerHTML =
      "<b>Modo demonstração.</b> Não achei os campos do GoHighLevel nesta " +
      "página, então nada foi gravado. Dentro do formulário, esta escolha " +
      "gravaria:<br>" +
      "<code>" + esc(CAMPOS.kit) + "</code> = <b>" + esc(valor) + "</b><br>" +
      "<code>" + esc(CAMPOS.marca) + "</code> = <b>" + esc(marca) + "</b>";
  }

  /* ============ EVENTOS ============ */

  grade.addEventListener("change", function(ev){
    var r = ev.target;
    if (!r || r.name !== "nk-kit") return;

    var kit = KITS[Number(r.getAttribute("data-i"))];
    barra.setAttribute("data-escolhido", "true");
    // innerHTML e nao textContent, para a referencia sair monoespacada como
    // no card. Os dois valores passam por esc(): a lista de kits e nossa,
    // mas nao e razao para abrir excecao no escape.
    barraVal.innerHTML = esc(kit.nome) + " <code>" + esc(kit.ref) + "</code>";

    if (!aplicar(r.value, kit.marca) && !DEBUG){
      // Os campos podem nao ter montado ainda. O observer cuida disso; se em
      // 2,5s nao aparecerem, avisa em vez de falhar em silencio.
      setTimeout(function(){
        if (pendente) modoDemo(pendente.valor, pendente.marca);
      }, 2500);
    }
  });

  // Tenta esconder ja, para o caso de os campos existirem antes de nos.
  esconderCampos();
  if (DEBUG) relatarCarga();

  // O formulario do GHL monta os campos depois deste script rodar, e o React
  // dele redesenha depois. O observer cobre as duas coisas: esconde o que
  // acabou de nascer, reesconde o que foi redesenhado, e reaplica a escolha
  // de quem clicou antes de os campos existirem.
  if (window.MutationObserver){
    var trabalhando = false;
    new MutationObserver(function(){
      if (trabalhando) return;          // as nossas proprias mudancas notificam de volta
      trabalhando = true;
      try {
        esconderCampos();
        if (pendente && aplicar(pendente.valor, pendente.marca)){
          aviso.classList.add("nk-oculto");
        }
      } finally {
        trabalhando = false;
      }
    }).observe(document.documentElement, { childList:true, subtree:true, attributes:true, attributeFilter:["class","style"] });
  }
})();
</script>
</div>
